name: Daily MLB Dashboard
# Two scheduled runs + manual trigger. Free for public repos.
#   04:05 UTC (12:05 AM ET) — CORE markets (ML / RL / Total) locked at the
#                             midnight line, before game-day public money.
#   15:00 UTC (11:00 AM ET) — PERIOD markets only (F5 / NRFI). Books post
#                             these morning-of; the overnight run can never
#                             see them. Core picks are NOT re-locked here.
on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      period_only:
        description: "Lock only F5/NRFI picks (period-market run)"
        required: false
        default: "false"
permissions:
  contents: write   # allow committing the generated page back to the repo
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ] || [ "${{ github.event.inputs.period_only }}" = "true" ]; then
            echo "PERIOD_ONLY=1" >> "$GITHUB_ENV"
            echo "label=Period-market pull (F5/NRFI)" >> "$GITHUB_OUTPUT"
          else
            echo "PERIOD_ONLY=" >> "$GITHUB_ENV"
            echo "label=Midnight pull" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate dashboard
        run: python run.py
      - name: Grade prior picks
        run: python grade.py || echo "grading skipped"
      - name: Add B divergence (today only, top of page)
        run: |
          D=$(grep -m1 -oE '^## [0-9]{4}-[0-9]{2}-[0-9]{2}' docs/PICKS.md | cut -d' ' -f2)
          python3 tools/b_unique.py docs/PICKS.md --markdown --date "$D" > /tmp/div.md || true
          if grep -qE '^\| (NEW|UPGRADE)' /tmp/div.md; then
            { echo "# ⚡ B Divergence — $D"; cat /tmp/div.md; echo ""; echo "---"; echo ""; cat docs/PICKS.md; } > /tmp/picks.md
            mv /tmp/picks.md docs/PICKS.md

            fi
      - name: Commit and publish page
        run: |
          git config user.name "mlb-bot"
          git config user.email "mlb-bot@users.noreply.github.com"
          git add -A docs/
          git commit -m "${{ steps.mode.outputs.label }} + grade $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
