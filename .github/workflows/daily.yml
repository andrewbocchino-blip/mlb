name: Daily MLB Dashboard
# Three scheduled runs + manual trigger. Free for public repos.
#   04:05 UTC (12:05a ET) — CORE markets (ML / Total) locked at midnight line
#   12:00 UTC ( 8:00a ET) — EARLY period pull: F5/NRFI + all three boards,
#                           taken before the day's money moves the numbers.
#                           This is the snapshot that OWNS the slate.
#   15:00 UTC (11:00a ET) — LATE period pull: re-prices the same slate with
#                           confirmed lineups where available. Dedupe means
#                           it can only ADD calls the 8am run did not make,
#                           never overwrite an 8am lock — so the early price
#                           is preserved and the two are comparable.
#   22:45 UTC ( 6:45p ET) — CLV capture: closing prices for today's picks
on:
  schedule:
    # EXPLICIT SLOTS WITH RETRIES (2026-08-28).
    #
    # The previous design woke every 30 minutes and let should_run.py decide
    # what was owed. That failed in practice: GitHub deprioritises
    # high-frequency schedules on public repos and silently drops most of
    # them. Observed 8/27 — a single run fired all day; 8/28 — none by 15:00
    # UTC. The guard logic was fine, it just was not being invoked.
    #
    # This replaces the heartbeat with a small number of EXPLICIT slots, each
    # with a retry an hour later, and every one offset from :00. Top-of-hour
    # is the most contested slot on GitHub's scheduler and the likeliest to
    # be dropped; :07 and :37 are far quieter. Fewer total invocations also
    # means less throttling. should_run.py still decides what each run does,
    # so a dropped slot is picked up by its retry rather than lost.
    # MULTIPLE ATTEMPTS PER WINDOW (2026-08-29).
    #
    # Two slots per window was still not enough. Observed 8/29: the 04:07
    # core slot fired, but 12:07, 13:37 and 15:07 were all dropped and the
    # day produced no period pull. The pattern is consistent — the slot that
    # lands is the one at midnight ET, and the ones that vanish are 8am-noon
    # ET, which is peak load on GitHub's scheduler. GitHub documents that
    # scheduled runs are delayed or dropped under load, and it does not
    # queue a missed run for later.
    #
    # There is no way to make any single slot reliable, so the answer is
    # more attempts spread across each window at irregular minutes. Runs
    # that find nothing owed exit in about twenty seconds, so the cost of
    # the extra attempts is trivial and public repos have unlimited minutes.
    - cron: "7 4 * * *"      # core          (12:07a ET)
    - cron: "41 4 * * *"     # core          (12:41a ET)
    - cron: "23 5 * * *"     # core          ( 1:23a ET)
    - cron: "7 12 * * *"     # early period  ( 8:07a ET)
    - cron: "29 12 * * *"    # early period  ( 8:29a ET)
    - cron: "51 12 * * *"    # early period  ( 8:51a ET)
    - cron: "19 13 * * *"    # early period  ( 9:19a ET)
    - cron: "43 13 * * *"    # early period  ( 9:43a ET)
    - cron: "7 15 * * *"     # late period   (11:07a ET)
    - cron: "29 15 * * *"    # late period   (11:29a ET)
    - cron: "51 15 * * *"    # late period   (11:51a ET)
    - cron: "19 16 * * *"    # late period   (12:19p ET)
    - cron: "43 16 * * *"    # late period   (12:43p ET)
    - cron: "47 22 * * *"    # clv           ( 6:47p ET)
    - cron: "11 23 * * *"    # clv           ( 7:11p ET)
    - cron: "39 23 * * *"    # clv           ( 7:39p ET)
  workflow_dispatch:
    inputs:
      period_only:
        description: "Lock only F5/NRFI picks + boards (period-market run)"
        required: false
        default: "false"
      catch_up:
        description: "Run whatever today still owes (recommended manual option)"
        required: false
        default: "false"
      clv_only:
        description: "Capture closing lines / CLV only"
        required: false
        default: "false"
      backtest:
        description: "Replay prop models on history -> docs/BACKTEST.md"
        required: false
        default: "false"
      analyze:
        description: "Sweep gates against the graded record -> docs/ANALYSIS.md"
        required: false
        default: "false"
      fit:
        description: "Refit guessed model parameters -> docs/FIT.md"
        required: false
        default: "false"
      drift:
        description: "Run-environment drift vs market -> docs/DRIFT.md"
        required: false
        default: "false"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Decide what today still owes
        id: guard
        run: python should_run.py

      - name: Decide run mode (manual overrides)
        id: mode
        run: |
          if [ "${{ github.event.inputs.catch_up }}" = "true" ]; then
            # Keep whatever should_run.py already wrote to $GITHUB_ENV — it
            # has read the artefacts and knows what is actually outstanding.
            echo "label=${RUN_LABEL:-Catch-up run}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.clv_only }}" = "true" ]; then
            echo "MODE=clv" >> "$GITHUB_ENV"
            echo "label=CLV close capture" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.period_only }}" = "true" ]; then
            echo "MODE=period" >> "$GITHUB_ENV"
            echo "PERIOD_ONLY=1" >> "$GITHUB_ENV"
            echo "PULL_TAG=manual" >> "$GITHUB_ENV"
            echo "PERIOD_ONLY=1" >> "$GITHUB_ENV"
            echo "label=Manual period pull" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Clear PERIOD_ONLY explicitly. should_run.py may have set it
            # before this step ran, and leaving it on made a manual CORE run
            # also write the boards — tagged "core", which then confused the
            # guard about whether the period pull had happened (seen 8/28).
            echo "MODE=core" >> "$GITHUB_ENV"
            echo "PULL_TAG=core" >> "$GITHUB_ENV"
            echo "PERIOD_ONLY=" >> "$GITHUB_ENV"
            echo "label=Manual core pull" >> "$GITHUB_OUTPUT"
          else
            # scheduled: keep whatever should_run.py already wrote to the env
            echo "label=${RUN_LABEL:-Scheduled pull}" >> "$GITHUB_OUTPUT"
          fi
      - name: Backtest prop models (history replay)
        if: github.event.inputs.backtest == 'true'
        run: python backtest_props.py --pitchers 40

      - name: Threshold + calibration analysis
        if: github.event.inputs.analyze == 'true'
        run: python analyze.py

      - name: Refit model parameters against real distributions
        if: github.event.inputs.fit == 'true'
        run: python fit_params.py --days 60 --players 120

      - name: Run-environment drift scan
        if: github.event.inputs.drift == 'true'
        run: python drift.py --days 45

      - name: Generate dashboard
        if: env.MODE != 'skip' && env.MODE != 'clv' && github.event.inputs.backtest != 'true' && github.event.inputs.analyze != 'true' && github.event.inputs.fit != 'true' && github.event.inputs.drift != 'true'
        run: python run.py
      - name: Capture closing lines (CLV)
        if: env.MODE != 'skip' && env.MODE == 'clv'
        run: python clv.py
      - name: Grade prior picks
        if: env.MODE != 'skip' && env.MODE != 'clv' && github.event.inputs.backtest != 'true' && github.event.inputs.analyze != 'true' && github.event.inputs.fit != 'true' && github.event.inputs.drift != 'true'
        run: python grade.py || echo "grading skipped"
      - name: Add B divergence (today only, top of page)
        if: env.MODE != 'skip' && env.MODE != 'clv'
        run: |
          D=$(grep -m1 -oE '^## [0-9]{4}-[0-9]{2}-[0-9]{2}' docs/PICKS.md | cut -d' ' -f2)
          python3 tools/b_unique.py docs/PICKS.md --markdown --date "$D" > /tmp/div.md || true
          if grep -qE '^\| (NEW|UPGRADE)' /tmp/div.md; then
            { echo "# ⚡ B Divergence — $D"; cat /tmp/div.md; echo ""; echo "---"; echo ""; cat docs/PICKS.md; } > /tmp/picks.md
            mv /tmp/picks.md docs/PICKS.md

            fi
      - name: Commit and publish page
        if: env.MODE != 'skip'
        run: |
          git config user.name "mlb-bot"
          git config user.email "mlb-bot@users.noreply.github.com"
          git add -A docs/
          git pull --rebase --autostash || true
          git commit -m "${{ steps.mode.outputs.label }} $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
